<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>今天吃什么？｜校园食堂</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <p class="eyebrow">CAMPUS FOOD PICKER</p>
        <h1>今天，<span>吃什么？</span></h1>
        <p class="intro">把纠结交给随机，让食堂给你一点小惊喜。</p>
      </section>

      <aside class="announcement" aria-label="公告">
        📢 数据持续更新中，菜品及价格以食堂现场为准。
      </aside>

      <section class="picker-card" aria-label="点餐筛选器">
        <div class="filters">
          <label>
            <span>校区</span>
            <select id="campus" aria-label="校区">
              <option value="all">全部校区</option>
            </select>
          </label>

          <label>
            <span>食堂</span>
            <select id="canteen" aria-label="食堂">
              <option value="all">全部食堂</option>
            </select>
          </label>

          <div class="quick-filter">
            <span class="filter-label">预算</span>
            <div class="quick-options" role="radiogroup" aria-label="预算">
              <label class="quick-option">
                <input type="radio" name="budget" value="" checked />
                <span>不限</span>
              </label>
              <label class="quick-option">
                <input type="radio" name="budget" value="15" />
                <span>15 元以内</span>
              </label>
              <label class="quick-option">
                <input type="radio" name="budget" value="20" />
                <span>20 元以内</span>
              </label>
              <label class="quick-option">
                <input type="radio" name="budget" value="25" />
                <span>25 元以内</span>
              </label>
            </div>
          </div>

          <div class="quick-filter">
            <span class="filter-label">菜品类型</span>
            <div id="typeOptions" class="quick-options" role="radiogroup" aria-label="菜品类型"></div>
          </div>
        </div>

        <button id="recommendButton" type="button" disabled>今天吃什么 <span>→</span></button>
      </section>

      <section class="result-card" id="result" aria-live="polite">
        <div class="food-emoji">🍜</div>
        <p class="result-label">等你来抽签</p>
        <h2>选好条件，开吃吧！</h2>
        <p class="result-description">点击上面的按钮，看看食堂今天为你准备了什么。</p>
      </section>
    </main>

    <footer>今天也要好好吃饭呀 ✦</footer>
    <script src="script.js"></script>
  </body>
</html>
